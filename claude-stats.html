<title>Claude Stats</title>
<style>
/* Layout: one centered stats panel — tab/range bar, 3x2 metric tiles, weekly activity grid, footer comparison. */
:root{
  --bg:#e4e3df; --panel:#e9e8e4; --tile:#dddcd7; --fg:#1d1c1a; --muted:#8c8a83; --cell:#d6d5d0;
  --accent:#2f6fe0; --seg:#dcdbd6; --segon:#f2f1ed; --warn:#c2410c;
  --h0:#d6d5d0; --h1:#a9c3f7; --h2:#7ea5f0; --h3:#4f86e8; --h4:#2f6fe0;
  --display:"Newsreader","Iowan Old Style",Georgia,serif; --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1b1a; --panel:#232322; --tile:#2c2c2a; --fg:#ecebe6; --muted:#8f8d86; --cell:#303030;
  --accent:#6b9cf5; --seg:#2c2c2a; --segon:#3a3a37; --warn:#fb923c;
  --h0:#303030; --h1:#2b4375; --h2:#3a5fa8; --h3:#4f7fe0; --h4:#7aa5ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1b1a; --panel:#232322; --tile:#2c2c2a; --fg:#ecebe6; --muted:#8f8d86; --cell:#303030;
  --accent:#6b9cf5; --seg:#2c2c2a; --segon:#3a3a37; --warn:#fb923c;
  --h0:#303030; --h1:#2b4375; --h2:#3a5fa8; --h3:#4f7fe0; --h4:#7aa5ff; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:32px}
.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1{font:400 clamp(26px,6vw,34px)/1.15 var(--display);margin:0;text-wrap:balance}
.badge{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:3px 9px}
.panel{background:var(--panel);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;gap:2px}
.seg button{font:inherit;font-size:15px;color:var(--muted);background:none;border:0;border-radius:8px;padding:7px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--segon);color:var(--fg)}
button:focus-visible,label.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--tile);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile span{font-size:13px;color:var(--muted)}
.tile b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile b.txt{font-weight:500;font-size:15px;padding-top:3px}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:2px}
.grid i{display:block;aspect-ratio:1;min-width:14px;border-radius:4px;background:var(--h0)}
.grid i[data-l="1"]{background:var(--h1)}.grid i[data-l="2"]{background:var(--h2)}
.grid i[data-l="3"]{background:var(--h3)}.grid i[data-l="4"]{background:var(--h4)}
.foot{color:var(--muted);font-size:14px;margin:0}
.models{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(80px,120px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.mrow .track{height:10px;background:var(--tile);border-radius:5px;overflow:hidden}
.mrow .fill{height:100%;background:var(--accent);border-radius:5px}
.mrow em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted)}
.load{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
label.file{display:inline-block;align-self:flex-start;background:var(--fg);color:var(--bg);border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
label.file input{position:absolute;opacity:0;width:1px;height:1px}
code{font-size:12.5px;background:var(--tile);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
@media(max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:wght@400;500&display=swap">

<div class="wrap">
  <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
    <h1 id="title">What’s up next?</h1>
    <span class="badge" id="badge">Пример данных</span>
  </div>

  <section class="panel" aria-label="Статистика">
    <div class="bar">
      <div class="seg" id="tabs" role="group" aria-label="Раздел">
        <button data-v="overview" aria-pressed="true">Overview</button>
        <button data-v="models" aria-pressed="false">Models</button>
      </div>
      <div class="seg" id="ranges" role="group" aria-label="Период">
        <button data-r="all" aria-pressed="true">All</button>
        <button data-r="30" aria-pressed="false">30d</button>
        <button data-r="7" aria-pressed="false">7d</button>
      </div>
    </div>

    <div id="overview" class="tiles"></div>
    <div id="models" class="models" hidden></div>
    <div id="heat" class="grid" aria-label="Активность по дням за последние 26 недель"></div>
    <p class="foot" id="foot"></p>
  </section>

  <section class="load">
    <span>Сейчас показан пример. Чтобы увидеть свои цифры, выберите файлы логов Claude Code (<code>~/.claude/projects/…/*.jsonl</code>). Они читаются прямо в браузере и никуда не отправляются.</span>
    <label class="file">Загрузить мои логи<input id="files" type="file" accept=".jsonl" multiple></label>
  </section>
</div>

<script>
(function(){
  var DUNE_TOKENS = 325000; // ~244k слов
  var DAY = 864e5;
  var state = {view:'overview', range:'all', events:[]};

  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function sample(){
    var r=rng(7), out=[], now=Date.now(), models=['Opus 5','Opus 5','Opus 5','Sonnet 5','Haiku 4.5'];
    for(var d=0; d<150; d++){
      if(r()<0.45) continue;
      var n=1+Math.floor(r()*3);
      for(var s=0;s<n;s++){
        var sid='s'+d+'_'+s, msgs=10+Math.floor(r()*300), hour=r()<0.5?21:Math.floor(9+r()*14);
        var m=models[Math.floor(r()*models.length)];
        for(var i=0;i<msgs;i+=10){
          out.push({t:now-d*DAY-(23-hour)*36e5+i*6e4, sid:sid, model:m, tokens:Math.floor(r()*4e6), msgs:10});
        }
      }
    }
    return out;
  }

  function fmt(n){return n.toLocaleString('en-US')}
  function short(n){
    if(n>=1e9) return (n/1e9).toFixed(n>=1e10?0:1).replace(/\.0$/,'')+'B';
    if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
    if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';
    return String(n);
  }
  function prettyModel(id){
    var m=/(opus|sonnet|haiku|fable)[- ]?(\d+(?:[.-]\d+)?)/i.exec(id||'');
    if(!m) return id||'unknown';
    return m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+' '+m[2].replace('-','.');
  }
  function dayKey(t){var d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

  function filtered(){
    if(state.range==='all') return state.events;
    var from=Date.now()-Number(state.range)*DAY;
    return state.events.filter(function(e){return e.t>=from});
  }

  function render(){
    var ev=filtered(), sessions={}, days={}, hours=new Array(24).fill(0), byModel={}, tokens=0, msgs=0;
    ev.forEach(function(e){
      sessions[e.sid]=1; days[dayKey(e.t)]=(days[dayKey(e.t)]||0)+e.msgs;
      hours[new Date(e.t).getHours()]+=e.msgs; tokens+=e.tokens; msgs+=e.msgs;
      var k=e.model; byModel[k]=byModel[k]||{tokens:0,msgs:0}; byModel[k].tokens+=e.tokens; byModel[k].msgs+=e.msgs;
    });
    var peak=hours.indexOf(Math.max.apply(null,hours));
    var fav=Object.keys(byModel).sort(function(a,b){return byModel[b].tokens-byModel[a].tokens})[0];
    var ph=ev.length?((peak%12)||12)+' '+(peak<12?'AM':'PM'):'—';

    var tiles=[['Sessions',fmt(Object.keys(sessions).length)],['Messages',fmt(msgs)],['Total tokens',short(tokens)],
      ['Active days',fmt(Object.keys(days).length)],['Peak hour',ph],['Favorite model',fav?prettyModel(fav):'—',1]];
    document.getElementById('overview').innerHTML=tiles.map(function(t){
      return '<div class="tile"><span>'+t[0]+'</span><b'+(t[2]?' class="txt"':'')+'>'+t[1]+'</b></div>'}).join('');

    var keys=Object.keys(byModel).sort(function(a,b){return byModel[b].tokens-byModel[a].tokens});
    document.getElementById('models').innerHTML=keys.map(function(k){
      var p=tokens?byModel[k].tokens/tokens*100:0;
      return '<div class="mrow"><span>'+prettyModel(k)+'</span><div class="track"><div class="fill" style="width:'+p.toFixed(1)+'%"></div></div><em>'+short(byModel[k].tokens)+' · '+p.toFixed(0)+'%</em></div>'}).join('')||'<span class="foot">Нет данных за период</span>';

    // heatmap: 26 weeks, columns = weeks (Mon..Sun rows), ending this week
    var today=new Date(); today.setHours(0,0,0,0);
    var dow=(today.getDay()+6)%7, start=new Date(today.getTime()-(dow+25*7)*DAY);
    var all=state.events, byDay={};
    all.forEach(function(e){var k=dayKey(e.t);byDay[k]=(byDay[k]||0)+e.msgs});
    var max=Math.max.apply(null,Object.keys(byDay).map(function(k){return byDay[k]}).concat([1])), cells='';
    for(var w=0;w<26;w++) for(var d=0;d<7;d++){
      var dt=new Date(start.getTime()+(w*7+d)*DAY);
      if(dt>today){cells+='<i style="visibility:hidden"></i>';continue}
      var v=byDay[dayKey(dt.getTime())]||0, l=v?Math.min(4,1+Math.floor(v/max*3.999)):0;
      cells+='<i data-l="'+l+'" title="'+dt.toLocaleDateString()+': '+v+'"></i>';
    }
    document.getElementById('heat').innerHTML=cells;
    document.getElementById('heat').style.gridTemplateColumns='repeat(26,minmax(14px,1fr))';

    var x=tokens/DUNE_TOKENS;
    document.getElementById('foot').textContent=tokens?'Вы использовали ~'+fmt(Math.round(x))+'× больше токенов, чем содержит «Дюна».':'';
  }

  function setPressed(group,attr,val){
    group.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset[attr]===val)})}
  document.getElementById('tabs').addEventListener('click',function(e){
    var v=e.target.dataset&&e.target.dataset.v; if(!v) return;
    state.view=v; setPressed(this,'v',v);
    document.getElementById('overview').hidden=v!=='overview';
    document.getElementById('models').hidden=v!=='models';
  });
  document.getElementById('ranges').addEventListener('click',function(e){
    var r=e.target.dataset&&e.target.dataset.r; if(!r) return;
    state.range=r; setPressed(this,'r',r); render();
  });

  document.getElementById('files').addEventListener('change',function(e){
    var files=Array.from(e.target.files), events=[], pending=files.length;
    if(!pending) return;
    files.forEach(function(f){
      var fr=new FileReader();
      fr.onload=function(){
        fr.result.split('\n').forEach(function(line){
          if(!line) return;
          var o; try{o=JSON.parse(line)}catch(_){return}
          if(!o.timestamp||(o.type!=='user'&&o.type!=='assistant')||o.isSidechain) return;
          var t=Date.parse(o.timestamp); if(isNaN(t)) return;
          var u=(o.message&&o.message.usage)||{}, tok=(u.input_tokens||0)+(u.output_tokens||0)+(u.cache_creation_input_tokens||0)+(u.cache_read_input_tokens||0);
          events.push({t:t,sid:o.sessionId||f.name,model:(o.message&&o.message.model)||'',tokens:tok,msgs:1});
        });
        if(--pending===0){
          events=events.filter(function(e){return e.model!=='<synthetic>'});
          // user lines carry no model: inherit the session's most common one
          var cnt={}; events.forEach(function(e){if(e.model){(cnt[e.sid]=cnt[e.sid]||{})[e.model]=(cnt[e.sid][e.model]||0)+1}});
          events.forEach(function(e){if(!e.model){var c=cnt[e.sid]||{};e.model=Object.keys(c).sort(function(a,b){return c[b]-c[a]})[0]||'unknown'}});
          state.events=events; document.getElementById('badge').hidden=true; render();
        }
      };
      fr.readAsText(f);
    });
  });

  state.events=sample(); render();
})();
</script>
